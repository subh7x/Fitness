<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="FitDay daily fitness and nutrition planner">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>FitDay — Today's Plan</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="./assets/icon-192.png" alt="FitDay logo"><div><strong>FitDay</strong><span>Today's Plan</span></div></div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">☾</button>
</header>

<main class="container">
  <section class="hero card">
    <div>
      <p class="eyebrow">YOUR DAILY FITNESS PLAN</p>
      <h1 id="dayTitle">Day 1 of 7</h1>
      <p id="focus">Full Body</p>
    </div>
    <div class="progress"><div id="progressFill"></div></div>
  </section>

  <section class="card workout-card">
    <div class="section-head">
      <div><p class="eyebrow">TODAY'S WORKOUT</p><h2 id="workoutTitle">Squats</h2></div>
      <span class="pill" id="workoutMeta">3 × 12</span>
    </div>
    <img id="workoutImage" class="workout-image" src="./assets/squats.png" alt="Today's workout">
    <ol id="steps" class="steps"></ol>
    <button id="completeBtn" class="primary">✓ Mark Workout Complete</button>
  </section>

  <section class="card">
    <div class="section-head"><div><p class="eyebrow">TODAY'S MEALS</p><h2>Simple Nutrition</h2></div></div>
    <div id="meals" class="meals"></div>
  </section>

  <section class="card swap-card">
    <div class="section-head"><div><p class="eyebrow">KITCHEN SWAP</p><h2>Change Ingredients</h2></div></div>
    <div class="controls">
      <label>Diet
        <select id="diet"><option>Vegetarian</option><option>Non-Vegetarian</option><option>Vegan</option></select>
      </label>
      <label>Protein
        <select id="protein"><option>Paneer</option><option>Chicken</option><option>Tofu</option><option>Lentils</option><option>Eggs</option></select>
      </label>
      <label>Carb
        <select id="carb"><option>Rice</option><option>Chapati</option><option>Oats</option><option>Potatoes</option></select>
      </label>
    </div>
    <button id="applyBtn" class="secondary">Apply Kitchen Ingredients</button>
  </section>

  <div class="actions">
    <button id="nextBtn" class="primary" disabled>Next Day →</button>
    <button id="resetBtn" class="danger">Reset Plan</button>
  </div>
  <p id="status" class="status"></p>
</main>

<script src="./script.js"></script>
</body>
</html>
